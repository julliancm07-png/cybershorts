# cybershorts configuration. Copy to config.yaml and edit.
# Secrets never go in this file; they live in .env. Any key omitted here uses the built-in default.

# Channel identity: shown on screen, in captions and in the script sign-off.
channel:
  name: "Cyber Shorts"
  handle: "@yourhandle"
  sign_off: "Follow for daily cyber news."

# RSS/Atom feeds to pull candidate stories from. Scripts use only title + summary from these.
feeds:
  - {name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/"}
  - {name: The Hacker News, url: "https://feeds.feedburner.com/TheHackersNews"}
  - {name: Krebs on Security, url: "https://krebsonsecurity.com/feed/"}
  - {name: SecurityWeek, url: "https://www.securityweek.com/feed/"}
  - {name: Dark Reading, url: "https://www.darkreading.com/rss.xml"}
  - {name: CISA, url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"}

# Story selection limits.
news:
  max_age_hours: 36        # ignore entries older than this
  max_candidates: 25       # cap on candidates passed to the picker
  fetch_full_text: true    # read the whole article so scripts have real specifics
  max_article_chars: 6000   # how much of it to send to the model

# OpenRouter model used to pick a story and write the script.
llm:
  model: "anthropic/claude-haiku-4.5"   # any OpenRouter model ID, e.g. "deepseek/deepseek-v4.1-flash-1017"
  temperature: 0.6
  target_words: [65, 95]  # spoken script length range
  # Extra guidance added to every script prompt, e.g. "a bit of dry humor; always end with one practical tip"
  style_notes: ""
  # OpenRouter host routing. sort: price = always the cheapest host for the model
  # (other values: throughput, latency). Add data_collection: deny to skip hosts
  # that may train on prompts (can cost a little more).
  provider:
    sort: price
  fact_check: true         # second model pass that checks the script against the article
  fact_check_model: ""     # empty = same model as above; any OpenRouter model ID to use another
  # Hook candidates per draft: the first paragraph plus alternates to pick from in Telegram. 1 = off.
  hooks: 3
  # Model that scores hook candidates; empty = fact_check_model, then model.
  hook_model: ""

# Narration. mode: tts (AI voice) or record (you send a Telegram voice message).
voice:
  mode: tts
  engine: kokoro           # elevenlabs (most human, needs ELEVENLABS_API_KEY), kokoro (free, local) or piper
  kokoro_voice: am_michael # try am_adam, am_eric, am_liam, am_onyx, af_heart, af_nicole, bm_george
  speed: 1.0               # kokoro: >1 faster
  piper_voice: "en_US-ryan-high"
  length_scale: 0.92       # piper: >1 slower, <1 faster
  fallback_engine: kokoro  # used automatically if ElevenLabs is out of credits or unreachable
  elevenlabs:
    voice_id: JBFqnCBsd6RMkjVDRZzb   # copy a Voice ID from elevenlabs.io > Voices (default: George)
    model: eleven_multilingual_v2     # eleven_v4 = newest, most expressive (audio tags); eleven_flash_v2_5 uses ~half the credits
    stability: 0.45          # lower = more expressive, higher = steadier
    similarity_boost: 0.8
    style: 0.15              # a little delivery style; 0 = neutral
    speaker_boost: true
    speed: 1.0               # 0.7-1.2
    # Models that understand audio tags such as [sighs]; other models get the tags stripped.
    tag_models: [eleven_v3, eleven_v4, eleven_v4_turbo]
    # Let the writer add a few audio tags to the voice script (captions never show them).
    audio_tags: true
    # Only these audio tags are kept; anything else is dropped.
    allowed_tags: [curious, excited, whispers, sighs, serious, laughs]
    # Most audio tags kept in one script.
    max_tags: 3
  chunking: paragraph      # paragraph = sentences flow naturally (recommended); sentence = one clip per sentence
  room_tone_db: -62        # faint background in pauses instead of dead silence; null = pure silence
  sentence_pause: 0.22     # seconds between sentences (sentence chunking only)
  paragraph_pause: 0.45    # ...and between paragraphs (beats) of the script
  polish: true             # trim, light compression, loudness-normalize
  # How the voice should SAY a word (captions still show the original spelling).
  # Add any name the voice gets wrong.
  pronunciations:
    CISA: "Sisa"
    SQL: "sequel"
    SaaS: "sass"
    macOS: "mac O S"
    iOS: "eye O S"
    2FA: "two factor"
    MFA: "M F A"
    NIST: "nist"
    OAuth: "oh auth"
    SSO: "S S O"
    DDoS: "D DOS"
    LLM: "L L M"
    LLMs: "L L Ms"
    APT: "A P T"

# Word-level captions via faster-whisper.
captions:
  whisper_model: "base.en"
  words_per_chunk: 3
  font: "DejaVu Sans"
  font_size: 92
  style: karaoke           # karaoke (word highlight as spoken) or plain (static chunks)

# Output video settings (FFmpeg).
video:
  width: 1080
  height: 1920
  fps: 30
  crf: 23
  preset: "veryfast"
  darken: 0.35             # 0 to 1, how much to darken the b-roll behind captions
  hook_seconds: 1.6        # opening seconds with a bold hook caption; 0 = off

# On-screen branding. Logo file lives in data/brand/ (see README).
branding:
  accent: "#3DDCFF"        # colour of the currently spoken word, the progress bar and the end-card "FOLLOW"
  keyword_color: "#FFD60A" # colour of emphasized keywords and the hook title
  watermark: "brand/logo.png" # path relative to data/; empty = no logo
  watermark_size: 150      # logo width in pixels
  watermark_opacity: 0.85  # 0 to 1
  progress_bar: true       # thin progress bar along the bottom; false = off
  end_card: true           # short closing card with channel handle; false = off

# Background clips. provider: pixabay (free key, default), pexels, local, or none.
# Drop your own .mp4 clips (screen recordings, homelab footage) in data/broll/:
# they are used when the API finds nothing, or always with provider: local.
# With no clip at all, the video gets a plain dark background.
broll:
  provider: pixabay
  local_dir: broll        # relative to data/, or an absolute path
  max_clips: 5            # most b-roll clips cut into one video
  ken_burns: true         # slow zoom/pan motion on b-roll; false = static frames
  # false: pick a random generic background from `queries` below (looks better, no odd matches).
  # true: search for a clip that matches the story.
  match_story: false
  # story = each paragraph gets footage matching what it's about (from the script writer), cyber pool as
  # fallback; mixed = alternate story and cyber clips; cyber = only the generic cyber pool below
  variety: story
  # Remember this many recently used clips and never reuse them
  recent_memory: 300
  # Tags never allowed for story footage (story clips skip require_tags)
  story_exclude_tags: [baby, child, children, kid, kids, wedding, christmas, bikini, dog, cat, flower, beach, sunset]
  queries:                # always cyber-themed searches; one is picked at random
    - cyber security
    - hacker code
    - binary code
    - matrix code
    - data network
    - digital security
    - computer code
    - circuit board
    - server data center
    - encryption
    - programming code
    - cyber technology
  # A clip is used only if its Pixabay tags contain one of these...
  require_tags: [cyber, hacker, hacking, security, code, coding, binary, matrix, data, digital, network, computer, technology, circuit, server, programming, encryption, internet, software, virus, malware]
  # ...and none of these (keeps out nature, people, crypto coins, etc.)
  exclude_tags: [nature, flower, animal, food, beach, ocean, sea, forest, landscape, mountain, sky, sunset, woman, girl, baby, child, family, wedding, christmas, dog, cat, bird, money, coin, bitcoin, crypto]

# YouTube Shorts upload (Data API). Requires scripts/auth_youtube.py first.
youtube:
  enabled: true
  privacy: public          # public, unlisted or private
  category_id: "28"
  contains_synthetic_media: false
  made_for_kids: false
  # Post an auto first comment after upload. The API cannot pin it; pin it in the YouTube app.
  first_comment: true

# TikTok upload. Drafts go to your TikTok inbox; you post from the app. Requires scripts/auth_tiktok.py.
tiktok:
  enabled: true

# Background music bed (quiet, ducks under the voice). Put licensed tracks in data/music/
# (e.g. YouTube Studio > Audio library, "Attribution not required"). No tracks = no music.
music:
  enabled: true
  folder: music          # relative to data/, or an absolute path
  volume_db: -20         # music level before ducking; -24 quieter, -16 louder
  duck: true             # dip the music while the narrator speaks
  on_tiktok: false       # false: TikTok gets the clean version so you can add a TikTok sound in the app
  prefer_kit: true       # use the generated sound kit beds (sound.kit bed*) when present; false = always use your folder

# Sound kit (cybershorts/soundkit.py, scripts/make_sound_kit.py): ElevenLabs-generated effects and music.
# Generate with: python scripts/make_sound_kit.py --dry-run, then python scripts/make_sound_kit.py
sound:
  # Master switch. false = videos render exactly as before, with no effects or kit music.
  enabled: true
  # Kit files, relative to data/ (not in git; included in the weekly backup).
  folder: brand/sound
  # true: TikTok gets the effects too; false = TikTok gets the voice-only mix.
  sfx_on_tiktok: true
  # ElevenLabs model for sound effects.
  sfx_model: eleven_text_to_sound_v3
  # ElevenLabs model for music.
  music_model: music_v2
  # Output format for generated files (192 kbps needs a Creator plan or higher).
  output_format: mp3_44100_192
  # How closely sound effects follow their prompt, 0 to 1.
  prompt_influence: 0.5
  # Seconds an effect starts before the beat it belongs to (the whoosh leads a cut).
  whoosh_lead: 0.12
  # Minimum seconds between two effects; the lower-priority one is dropped.
  min_gap: 0.3
  # Peak limiter ceiling for the effects mix (1.0 = full scale).
  limit: 0.95
  # Level of each effect in dB before mixing.
  gain_db:
    hook: -10
    whoosh: -16
    breaking: -12
    card: -18
    outro: -10
  # Recap audio levels.
  recap:
    # Level of the signature theme under the recap intro, in dB.
    theme_db: -12
    # Level of the background bed under the recap narration, in dB.
    bed_db: -22
    # Dip the bed while the narrator speaks.
    duck: true
  # Estimated credit costs, used by the dry run and the balance check.
  credits:
    # ElevenLabs credits per second of generated sound effect.
    sfx_per_second: 40
    # Estimated credits per minute of generated music (ElevenLabs does not publish this).
    music_per_minute: 900
  # The sounds to generate: name, kind (sfx or music), prompt, seconds, and loop (true = seamless loop bed).
  kit:
    - {name: hook, kind: sfx, prompt: "short digital glitch impact, punchy opening hit for a cybersecurity news video", seconds: 1.0, loop: false}     # opening hit on Shorts
    - {name: whoosh, kind: sfx, prompt: "fast airy transition whoosh, clean, digital", seconds: 0.6, loop: false}     # played before each beat change
    - {name: breaking, kind: sfx, prompt: "urgent alert tone, two-note digital warning, breaking news", seconds: 1.5, loop: false}     # played on breaking videos
    - {name: card, kind: sfx, prompt: "UI data blip, soft digital notification tick", seconds: 0.5, loop: false}     # played when the CVE data card appears
    - {name: outro, kind: sfx, prompt: "signature sting, short dark synth resolve with a soft digital tail", seconds: 2.0, loop: false}     # played at the end card
    - {name: theme, kind: music, prompt: "dark synth cyber signature intro, short, memorable, instrumental, no vocals", seconds: 8, loop: false}     # recap intro theme
    - {name: bed1, kind: music, prompt: "instrumental, dark minimal techno bed to sit under narration, steady pulse, sparse, no vocals, no lead melody, no drops, low dynamics", seconds: 75, loop: true}     # background bed (looped)
    - {name: bed2, kind: music, prompt: "instrumental, subtle synthwave underscore for tech news, warm pads, light arpeggio, steady, no vocals, no drops, low dynamics", seconds: 90, loop: true}     # background bed (looped)
    - {name: bed3, kind: music, prompt: "instrumental, tense low-key electronic underscore, cybersecurity documentary feel, soft ticking percussion, no vocals, no drops, low dynamics", seconds: 60, loop: true}     # background bed (looped)

# Delete rendered videos this many days after they are published or rejected.
cleanup:
  keep_days: 7

# Uptime Kuma push monitor (HEALTHCHECK_URL in .env). The bot pings while it runs.
# In Kuma set the monitor's Heartbeat Interval a bit above interval_seconds (e.g. 360).
health:
  interval_seconds: 300
  # false only for a self-signed https Kuma URL (better: use http://<kuma-ip>:3001/api/push/...)
  verify_tls: true

# Telegram alerts when a scheduled job or the bot fails (and a note when it works again).
alerts:
  enabled: true
  # A job that keeps failing alerts at most once per this many minutes.
  repeat_minutes: 180
  # Log lines included in the alert.
  log_lines: 25

# Weekly backup of .env, config.yaml, logins and the database (scripts/backup.py).
# Set BACKUP_PASSPHRASE in .env to encrypt it and also send it to your Telegram chat.
backup:
  # Local backups kept in data/backups.
  keep: 8
  telegram: true
  max_telegram_mb: 45

# Recurring series labels. A draft may get one series: its badge, hashtag and writing guidance.
series:
  # Master switch for series labels.
  enabled: true
  items:
    # Patch This Now: a fix or update is out, or the flaw is being exploited.
    - {name: "Patch This Now", hashtag: PatchThisNow, badge: "PATCH THIS NOW", per_week: null, match: "patch, update, fixed, actively exploited, KEV", guidance: "Name the product, the fix and any deadline."}
    # Scam of the Week: a scam, phishing or fraud story; at most one per week.
    - {name: "Scam of the Week", hashtag: ScamOfTheWeek, badge: "SCAM OF THE WEEK", per_week: 1, match: "scam, phishing, fraud, smishing, impersonation", guidance: "How the scam works + the one tell."}
    # CVE in 30s: a story about one named CVE.
    - {name: "CVE in 30s", hashtag: CVEin30s, badge: "CVE IN 30S", per_week: null, match: "a single named CVE", guidance: "What, who, how bad, what to do."}

# Data card: a short CVE panel (CVSS, severity, exploited, patch) shown over CVE stories.
data_card:
  # Master switch for the data card.
  enabled: true
  # Look up CVSS scores from the NVD API. Optional NVD_API_KEY in .env raises the rate limit.
  nvd: true
  # Seconds the card stays on screen.
  seconds: 4.5

# Breaking drafts, created by scripts/breaking.py on a timer.
breaking:
  # Master switch for breaking drafts.
  enabled: true
  # Watch the CISA Known Exploited Vulnerabilities (KEV) catalog for new entries.
  kev: true
  # Also score fresh RSS items for urgency in one LLM call.
  rss_urgency: true
  # Minimum urgency score (0-10) for an RSS item to become a breaking draft.
  urgency_threshold: 8
  # Only RSS items published within this many minutes are scored.
  rss_max_age_minutes: 120
  # Most RSS items sent to the urgency scorer in one call.
  max_score_items: 15
  # Model for urgency scoring; empty = llm.model.
  urgency_model: ""
  # Most breaking drafts created per local day.
  daily_cap: 2
  # No breaking drafts between these local times (HH:MM).
  quiet_hours: ["22:00", "07:00"]
  # Time zone for quiet_hours and the daily cap.
  timezone: America/New_York
  # Ignore KEV entries added to the catalog more than this many days ago.
  kev_max_age_days: 2
  # Badge text drawn on breaking videos.
  badge: "BREAKING"
  # Badge colour.
  badge_color: "#FF3B30"
  # Prefix added to breaking YouTube titles.
  title_prefix: "🚨 "

# Weekly analytics job (scripts/analytics.py): feeds what performed well back into writing.
analytics:
  # Master switch for the analytics job.
  enabled: true
  # Only videos published within this many days are tracked.
  lookback_days: 90
  # A video's stats count only once it is this old (YouTube analytics lags 2-3 days).
  min_age_hours: 48
  # Below this many eligible videos no learnings are written.
  min_videos: 6
  # Videos in each of the top and bottom groups that are compared.
  top_n: 5
  # Cap on the size of data/learnings.md.
  learnings_max_chars: 800
  # Feed data/learnings.md into the writer prompt.
  use_learnings: true
  # Send the weekly Telegram report.
  report: true
  # Model for the learnings pass; empty = llm.model.
  model: ""

# Weekly long-form recap (cybershorts/recap.py): a landscape YouTube video of the week's top stories.
recap:
  # Master switch for the Sunday recap and /recap in Telegram.
  enabled: true
  # Label shown in the video and Telegram; {n} = this channel's recap number (published recaps + 1).
  label: "Week {n}"
  # Most stories from the past week's published Shorts used in one recap.
  stories: 5
  # Below this many published Shorts in the lookback window no recap is made.
  min_stories: 3
  # Only Shorts published within this many days count toward a recap.
  lookback_days: 7
  # Time zone that defines the ISO week (YYYY-Www) and the Sunday schedule.
  timezone: America/New_York
  # OpenRouter model for the recap script; empty = llm.model.
  model: ""
  # Spoken script length range in words for the whole recap.
  target_words: [900, 1200]
  # Re-fetch each story's article so the script has real specifics.
  fetch_article: true
  # How much of each article to send to the model.
  max_article_chars: 4000
  # Most audio tags kept in the recap voice script.
  max_audio_tags: 5
  # Prefix added to the recap YouTube title.
  title_prefix: "This Week in Cyber: "
  # Last line of the outro, used when the outro has no "subscribe" wording.
  subscribe_line: "Subscribe for a new recap every Sunday."
  # YouTube category ID for recaps (28 = Science & Technology).
  category_id: "28"
  # Video width in pixels (landscape).
  width: 1920
  # Video height in pixels.
  height: 1080
  # Output frame rate.
  fps: 30
  # x264 quality for the final encode (lower = larger file, better quality).
  crf: 22
  # x264 speed preset for the final encode.
  preset: veryfast
  # Seconds allowed for one FFmpeg render before it is stopped.
  render_timeout: 3600
  # Landscape b-roll clips fetched per story part.
  broll_per_part: 2
  # Most b-roll clips cut into one recap.
  max_clips: 12
  # Font size of the lower-third captions.
  caption_font_size: 52
  # Caption words shown together on screen.
  words_per_chunk: 6
  # Seconds the story title card stays on screen.
  title_card_seconds: 3.5
  # Visual style: newsroom (animated scenes, no stock b-roll) or classic (the older b-roll style).
  layout: newsroom
  # Stock b-roll: auto (on for classic, off for newsroom), true or false.
  broll: auto
  # Title shown in the top bar of the recap video.
  show_title: "THIS WEEK IN CYBER"
  # Settings for the newsroom layout.
  newsroom:
    # Seconds the full-screen story transition card stays up (capped at 40% of the part).
    transition_seconds: 3.0
    # Seconds each animated scene is planned to last.
    scene_seconds: 12
    # Shortest animated scene in seconds.
    scene_min_seconds: 6
    # Longest animated scene in seconds; longer gaps get an automatic scene.
    scene_max_seconds: 18
    # Animated scene types the writer may pick: terminal, flow, stat, timeline, scam.
    scenes: [terminal, flow, stat, timeline, scam]
    # Show the key points on screen.
    key_points: true
    # Most key points shown per story.
    max_key_points: 4
    # Show the what-to-do checklist for actionable stories.
    checklist: true
    # Font size of the captions in the newsroom layout.
    caption_font_size: 44
    # Most characters per caption line.
    caption_max_chars: 33
    # Faint scanline sweep over the background.
    scanline: true
    # Background gradient colours, diagonal from top-left to bottom-right.
    bg_colors: ["#070B14", "#101A33"]
    # Fill colour of the content panels.
    panel_color: "#0F1626"
  # Seconds a /recap or timer run waits for the draft lock before giving up.
  lock_timeout: 1800
  # Low-resolution copy sent to Telegram for review.
  preview:
    # Preview width in pixels.
    width: 854
    # Preview height in pixels.
    height: 480
    # Largest preview file in MiB (Telegram bot upload limit is 50 MB).
    max_mb: 45
    # Preview audio bitrate in kbps.
    audio_kbps: 64
    # Upper limit on the preview video bitrate in kbps.
    max_kbps: 1500
